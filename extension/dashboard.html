<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Club Royale Finder</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="logo">♠ Club Royale Finder</span>
    <input id="search" type="search" placeholder="Search ship, itinerary, port…" autocomplete="off" />
    <select id="sort-select">
      <option value="sailDate">Sail date ↑</option>
      <option value="sailDate-desc">Sail date ↓</option>
      <option value="bookBy">Offer expiring soon</option>
      <option value="nights-desc">Longest first</option>
      <option value="nights">Shortest first</option>
    </select>
    <div id="view-toggle">
      <button data-view="list" class="active">☰ List</button>
      <button data-view="calendar">📅 Cal</button>
    </div>
    <button id="fav-toggle" title="Show only favorites">☆ Favorites</button>
    <span id="sync-status">Loading…</span>
    <button id="sync-now-btn">Sync Now</button>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="filter-section">
        <div class="filter-label-row">
          <span class="filter-label">Ship</span>
          <span class="filter-actions">
            <button class="filter-action" data-action="clear" data-target="ships">Clear</button>
          </span>
        </div>
        <div class="chip-group scrollable" id="ship-chips"></div>
      </div>
      <div class="filter-section">
        <div class="filter-label-row">
          <span class="filter-label">Region</span>
          <span class="filter-actions">
            <button class="filter-action" data-action="clear" data-target="regions">Clear</button>
          </span>
        </div>
        <div class="chip-group scrollable" id="region-chips"></div>
      </div>
      <div class="filter-section">
        <div class="filter-label-row">
          <span class="filter-label">Room Type</span>
          <span class="filter-actions">
            <button class="filter-action" data-action="clear" data-target="rooms">Clear</button>
          </span>
        </div>
        <div class="chip-group scrollable" id="room-chips"></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Nights</div>
        <div class="nights-row">
          <span id="nights-val">Any</span>
          <input type="range" id="nights-range" min="0" max="30" value="0" step="1" />
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Sailing Within</div>
        <div class="chip-group" id="sail-preset-chips">
          <button class="chip active" data-days="0">Any</button>
          <button class="chip" data-days="30">30 days</button>
          <button class="chip" data-days="90">90 days</button>
          <button class="chip" data-days="180">6 months</button>
          <button class="chip" data-days="365">1 year</button>
          <button class="chip" data-days="custom">Custom…</button>
        </div>
        <div class="date-inputs" id="sail-custom-inputs" style="display:none">
          <input type="date" id="sail-from" />
          <input type="date" id="sail-to" />
        </div>
      </div>
      <button id="reset-btn">Reset Filters</button>
    </div>

    <div id="content">
      <div id="result-count"></div>
      <div id="list-view"></div>
      <div id="calendar-view" style="display:none"></div>
    </div>
  </div>
</div>
<script src="dashboard.js" type="module"></script>
</body>
</html>
